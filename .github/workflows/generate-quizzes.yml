name: 生成测验

on:
  workflow_dispatch:
    inputs:
      topic_1:
        description: '主题 1'
        required: true
      topic_2:
        description: '主题 2'
        required: false
      topic_3:
        description: '主题 3'
        required: false
      topic_4:
        description: '主题 4'
        required: false
      topic_5:
        description: '主题 5'
        required: false
      topic_6:
        description: '主题 6'
        required: false
      topic_7:
        description: '主题 7'
        required: false
      topic_8:
        description: '主题 8'
        required: false
      topic_9:
        description: '主题 9'
        required: false
      topic_10:
        description: '主题 10'
        required: false
      hint:
        description: '硬性约束（所有主题共用，可选）'
        required: false
      provider:
        description: 'AI 提供商'
        required: true
        default: 'zhipu'
        type: choice
        options:
          - zhipu
          - deepseek
          - gemini
          - anthropic

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: 解析主题列表
        id: parse
        env:
          T1:  ${{ github.event.inputs.topic_1 }}
          T2:  ${{ github.event.inputs.topic_2 }}
          T3:  ${{ github.event.inputs.topic_3 }}
          T4:  ${{ github.event.inputs.topic_4 }}
          T5:  ${{ github.event.inputs.topic_5 }}
          T6:  ${{ github.event.inputs.topic_6 }}
          T7:  ${{ github.event.inputs.topic_7 }}
          T8:  ${{ github.event.inputs.topic_8 }}
          T9:  ${{ github.event.inputs.topic_9 }}
          T10: ${{ github.event.inputs.topic_10 }}
        run: |
          topics_json=$(python3 -c '
import os, json
keys = ["T1","T2","T3","T4","T5","T6","T7","T8","T9","T10"]
topics = [os.environ[k].strip() for k in keys if os.environ.get(k,"").strip()]
print(json.dumps(topics, ensure_ascii=False))
')
          echo "matrix={\"topic\":$topics_json}" >> "$GITHUB_OUTPUT"

  generate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成测验
        env:
          ZHIPU_API_KEY:     ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WX_APPID:          ${{ secrets.WX_APPID }}
          WX_APPSECRET:      ${{ secrets.WX_APPSECRET }}
          WX_CLOUD_ENV:      ${{ secrets.WX_CLOUD_ENV }}
          TOPIC:             ${{ matrix.topic }}
          PROVIDER:          ${{ github.event.inputs.provider }}
          HINT:              ${{ github.event.inputs.hint }}
        run: |
          touch /tmp/before_generate
          if [ -n "$HINT" ]; then
            node scripts/generate-quiz.js --topic="$TOPIC" --provider="$PROVIDER" --hint="$HINT"
          else
            node scripts/generate-quiz.js --topic="$TOPIC" --provider="$PROVIDER"
          fi
          mkdir -p /tmp/quiz-output
          find scripts/data -name "*.json" -newer /tmp/before_generate -exec cp {} /tmp/quiz-output/ \;

      - name: 保存生成文件（备用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-${{ strategy.job-index }}
          path: /tmp/quiz-output/*.json
          retention-days: 7
