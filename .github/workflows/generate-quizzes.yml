name: 生成测验

on:
  workflow_dispatch:
    inputs:
      topics:
        description: '测验主题，每行一个'
        required: true
      provider:
        description: 'AI 提供商'
        required: true
        default: 'zhipu'
        type: choice
        options:
          - zhipu
          - deepseek
          - gemini
          - anthropic

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成测验
        env:
          ZHIPU_API_KEY:     ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WX_APPID:          ${{ secrets.WX_APPID }}
          WX_APPSECRET:      ${{ secrets.WX_APPSECRET }}
          WX_CLOUD_ENV:      ${{ secrets.WX_CLOUD_ENV }}
        run: |
          PROVIDER="${{ github.event.inputs.provider }}"

          while IFS= read -r topic; do
            topic="$(echo "$topic" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$topic" ] && continue
            echo "▶ 生成：$topic"
            node scripts/generate-quiz.js --topic="$topic" --provider="$PROVIDER"
          done <<'TOPICS'
          ${{ github.event.inputs.topics }}
          TOPICS
