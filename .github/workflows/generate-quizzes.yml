name: 生成测验

concurrency:
  group: generate-quizzes
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      topic_1:
        description: '主题 1'
        required: true
      topic_2:
        description: '主题 2'
        required: false
      topic_3:
        description: '主题 3'
        required: false
      topic_4:
        description: '主题 4'
        required: false
      topic_5:
        description: '主题 5'
        required: false
      topic_6:
        description: '主题 6'
        required: false
      topic_7:
        description: '主题 7'
        required: false
      topic_8:
        description: '主题 8'
        required: false
      topic_9:
        description: '主题 9'
        required: false
      topic_10:
        description: '主题 10'
        required: false
      topic_11:
        description: '主题 11'
        required: false
      topic_12:
        description: '主题 12'
        required: false
      topic_13:
        description: '主题 13'
        required: false
      topic_14:
        description: '主题 14'
        required: false
      topic_15:
        description: '主题 15'
        required: false
      topic_16:
        description: '主题 16'
        required: false
      topic_17:
        description: '主题 17'
        required: false
      topic_18:
        description: '主题 18'
        required: false
      topic_19:
        description: '主题 19'
        required: false
      topic_20:
        description: '主题 20'
        required: false
      hint:
        description: '硬性约束（所有主题共用，可选）'
        required: false
      provider:
        description: 'AI 提供商'
        required: true
        default: 'zhipu'
        type: choice
        options:
          - zhipu
          - deepseek
          - gemini
          - anthropic
      model:
        description: 'AI 模型（留空使用提供商默认值）'
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析主题列表
        id: parse
        env:
          T1:  ${{ github.event.inputs.topic_1 }}
          T2:  ${{ github.event.inputs.topic_2 }}
          T3:  ${{ github.event.inputs.topic_3 }}
          T4:  ${{ github.event.inputs.topic_4 }}
          T5:  ${{ github.event.inputs.topic_5 }}
          T6:  ${{ github.event.inputs.topic_6 }}
          T7:  ${{ github.event.inputs.topic_7 }}
          T8:  ${{ github.event.inputs.topic_8 }}
          T9:  ${{ github.event.inputs.topic_9 }}
          T10: ${{ github.event.inputs.topic_10 }}
          T11: ${{ github.event.inputs.topic_11 }}
          T12: ${{ github.event.inputs.topic_12 }}
          T13: ${{ github.event.inputs.topic_13 }}
          T14: ${{ github.event.inputs.topic_14 }}
          T15: ${{ github.event.inputs.topic_15 }}
          T16: ${{ github.event.inputs.topic_16 }}
          T17: ${{ github.event.inputs.topic_17 }}
          T18: ${{ github.event.inputs.topic_18 }}
          T19: ${{ github.event.inputs.topic_19 }}
          T20: ${{ github.event.inputs.topic_20 }}
        run: python3 .github/scripts/parse_topics.py

  generate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quiz-generator/package-lock.json

      - name: 安装依赖
        run: cd quiz-generator && npm ci


      - name: 生成测验
        env:
          ZHIPU_API_KEY:     ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WX_APPID:          ${{ secrets.WX_APPID }}
          WX_APPSECRET:      ${{ secrets.WX_APPSECRET }}
          WX_CLOUD_ENV:      ${{ secrets.WX_CLOUD_ENV }}
          TOPIC:             ${{ matrix.topic }}
          PROVIDER:          ${{ github.event.inputs.provider }}
          MODEL:             ${{ github.event.inputs.model }}
          HINT:              ${{ github.event.inputs.hint }}
        run: |
          touch /tmp/before_generate

          ARGS="--topic=\"$TOPIC\" --provider=\"$PROVIDER\""
          [ -n "$MODEL" ] && ARGS="$ARGS --model=\"$MODEL\""
          [ -n "$HINT" ]  && ARGS="$ARGS --hint=\"$HINT\""

          eval node quiz-generator/generate.js $ARGS

          mkdir -p /tmp/quiz-output
          # 只要最终测验 JSON（quiz-generator 写在 scripts/data 根目录），排除 .checkpoints 与子目录里的其它 json
          find scripts/data -maxdepth 1 -type f -name "*.json" -newer /tmp/before_generate \
            -exec cp -t /tmp/quiz-output/ {} +

      - name: 保存结果（topic 级别备份）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-topic-${{ strategy.job-index }}
          path: /tmp/quiz-output/*.json
          if-no-files-found: ignore
          retention-days: 7

  collect:
    needs: generate
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载所有 topic 的结果
        uses: actions/download-artifact@v4
        with:
          pattern: quiz-topic-*
          merge-multiple: true
          path: scripts/data/pipelined_materials

      - name: 提交到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add scripts/data/pipelined_materials/*.json
          count=$(git diff --cached --name-only | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "没有新文件，跳过提交。"
          else
            git commit -m "chore: add $count generated quiz(zes) [skip ci]"
            git push
          fi

      - name: 生成汇总报告
        run: |
          count=$(ls scripts/data/pipelined_materials/*.json 2>/dev/null | wc -l)
          new=$(git diff HEAD~1 --name-only 2>/dev/null | grep "scripts/data/pipelined_materials/" | wc -l || echo "?")
          echo "## 批量生成结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "本次新增 **${new}** 个 / 文件夹共 **${count}** 个测验" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$new" -gt 0 ] 2>/dev/null; then
            echo "| 新增文件 |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|" >> $GITHUB_STEP_SUMMARY
            git diff HEAD~1 --name-only 2>/dev/null | grep "scripts/data/pipelined_materials/" | while read f; do
              echo "| $(basename $f) |" >> $GITHUB_STEP_SUMMARY
            done
          fi
