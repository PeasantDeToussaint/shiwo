name: 批量生成测验（顺序）

on:
  workflow_dispatch:
    inputs:
      quizzes:
        description: "测验序号（逗号分隔如 1,3,12）或 all"
        required: true
        default: "all"
      dry_run:
        description: "只生成本地文件，不上传 CloudBase"
        required: true
        default: true
        type: boolean
      estimate:
        description: "只估算成本，不真正生成"
        required: true
        default: false
        type: boolean
      skip_eval:
        description: "跳过质量评估"
        required: true
        default: false
        type: boolean

jobs:
  generate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 顺序生成所有测验
        env:
          ZHIPU_API_KEY:    ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WX_APPID:         ${{ secrets.WX_APPID }}
          WX_APPSECRET:     ${{ secrets.WX_APPSECRET }}
          WX_CLOUD_ENV:     ${{ secrets.WX_CLOUD_ENV }}
          QUIZZES:   ${{ github.event.inputs.quizzes }}
          DRY_RUN:   ${{ github.event.inputs.dry_run }}
          ESTIMATE:  ${{ github.event.inputs.estimate }}
          SKIP_EVAL: ${{ github.event.inputs.skip_eval }}
        run: node scripts/run-batch.js

      - name: 上传所有产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-quizzes-${{ github.run_id }}
          path: scripts/data/
          if-no-files-found: ignore
          retention-days: 14
